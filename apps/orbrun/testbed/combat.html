<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbrun · Combat feedback preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: #080c13; color: #d9d3c6; font: 14px system-ui, sans-serif; }
    header, footer { padding: 18px 24px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border-bottom: 1px solid #28303a; }
    h1 { font-size: 17px; margin: 0 12px 0 0; color: #e7c98f; }
    label { display: flex; align-items: center; gap: 6px; }
    button, select { background: #151c27; color: #e5e2d9; border: 1px solid #384354; border-radius: 4px; padding: 7px 10px; cursor: pointer; }
    button:hover { background: #283348; border-color: #e7c98f; }
    #dungeon { position: relative; min-height: 0; }
    canvas { position: absolute; display: block; }
    footer { border-top: 1px solid #28303a; color: #929ca9; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Orbrun / Combat feedback</h1>
    <label>View <select id="projection"><option value="2.5d">Dungeon 2.5D</option><option value="2d">Tiles 2D</option><option value="3d">First person</option></select></label>
    <label>Death material <select id="death-kind"><option>goblin</option><option>skeleton</option><option>jelly</option><option>stone golem</option><option>phantom</option><option>fire elemental</option><option>ice beast</option><option>thorn hunter</option><option>hornet</option><option>water elemental</option></select></label>
    <button data-effect="light">Light hit</button><button data-effect="solid">Solid hit</button><button data-effect="hit">Heavy hit</button><button data-effect="dart">Magic Dart</button><button data-effect="incoming">Enemy melee</button><button data-effect="exact">Exact 23</button><button data-effect="miss">Miss</button><button data-effect="fire">Fire</button><button data-effect="cold">Cold</button><button data-effect="kill">Kill</button><button data-effect="block">Block</button><button data-effect="hurt">Hurt</button><button data-effect="status">Poison</button><button data-effect="heal">Heal</button>
    <button data-effect="armor">Enemy armor</button><button data-effect="incomingArmor">Player armor</button><button data-effect="dodge">Player dodge</button><button data-effect="enemyBlock">Enemy block</button><button data-effect="level">Level up</button>
    <label><input type="checkbox" id="reduced"> Reduced motion</label>
    <label><input type="checkbox" id="paused"> Freeze effects</label>
    <label>Frame <select id="effect-age"><option value="180">Impact</option><option value="450">Spray</option><option value="1100">Remains</option><option value="3500">Fading</option><option value="5500">Expired</option></select></label>
  </header>
  <main id="dungeon"></main>
  <footer>Development preview · Cyan: player defenses / amber: enemy defenses · Pink: player damage / mint: player healing · Freeze effects for inspection</footer>
  <script type="module" src="./combat.ts"></script>
</body>
</html>
